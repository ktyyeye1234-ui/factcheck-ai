<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FACT CHECK AI</title>
<style>
:root{--bg:#f3f7fc;--card:#fff;--tx:#0f1b33;--mu:#5b6b85;--nv:#0b2a5b;--sk:#0ea5e9;--sk2:#e0f2fe;--bd:#d6e2f0;--g:#15803d;--gb:#dcfce7;--a:#b45309;--ab:#fef3c7;--r:#b91c1c;--rb:#fee2e2;--n:#475569;--nb:#e2e8f0;--hd:#0b2a5b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#111e35;--tx:#e8f0fb;--mu:#9db0cc;--nv:#7cc4f5;--sk:#38bdf8;--sk2:#12304d;--bd:#233451;--g:#4ade80;--gb:#12351f;--a:#fbbf24;--ab:#3a2c0d;--r:#f87171;--rb:#3d1717;--n:#cbd5e1;--nb:#27344a;--hd:#0d1b33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1424;--card:#111e35;--tx:#e8f0fb;--mu:#9db0cc;--nv:#7cc4f5;--sk:#38bdf8;--sk2:#12304d;--bd:#233451;--g:#4ade80;--gb:#12351f;--a:#fbbf24;--ab:#3a2c0d;--r:#f87171;--rb:#3d1717;--n:#cbd5e1;--nb:#27344a;--hd:#0d1b33;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff}
.hr{max-width:1100px;margin:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px}
.logo{font-weight:800;letter-spacing:.5px;font-size:18px;color:#fff;text-decoration:none;flex:1}.logo b{color:#38bdf8}
nav{max-width:1100px;margin:auto;display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto}
nav a{color:#c9d8ee;text-decoration:none;padding:8px 14px;border-radius:999px;white-space:nowrap;font-size:15px}
nav a.on{background:#38bdf8;color:#06203f;font-weight:700}
.tg{background:transparent;border:1px solid #4a6490;color:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
main{max-width:1100px;margin:auto;padding:20px 16px 48px}
h1{font-size:clamp(26px,5vw,40px);line-height:1.25;margin:8px 0;color:var(--nv)}h2{font-size:20px;margin:0 0 10px;color:var(--nv)}h3{font-size:16px;margin:0 0 6px}
.mu{color:var(--mu)}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px}
.hero{text-align:center;padding:22px 0 8px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}@container (min-width:720px){.grid{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
#frame{container-type:inline-size}
:root[data-dev]{overflow:hidden}
:root[data-dev] body{height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 65%,#000)}
:root[data-dev] #frame{flex:none;overflow:auto;background:var(--bg);border-radius:18px;box-shadow:0 0 0 2px var(--bd),0 12px 40px rgba(0,0,0,.35)}
:root[data-dev] header{top:0}
textarea{width:100%;min-height:200px;resize:vertical;padding:14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
textarea:focus{outline:2px solid var(--sk);border-color:var(--sk)}
.btn{border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--nv);color:#fff;min-height:48px}
:root[data-theme="dark"] .btn{color:#06203f}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06203f}}
.btn.s{background:var(--sk2);color:var(--nv)!important}.btn.o{background:transparent;border:1.5px solid var(--bd);color:var(--tx)!important}.btn.sm{padding:8px 14px;min-height:38px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row.c{justify-content:center}
.v{display:flex;gap:14px;align-items:center;border-radius:16px;padding:18px;margin-bottom:16px}
.v i{font-style:normal;font-size:28px;font-weight:800;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:none}
.v.g{background:var(--gb);color:var(--g)}.v.a{background:var(--ab);color:var(--a)}.v.r{background:var(--rb);color:var(--r)}.v.n{background:var(--nb);color:var(--n)}
.v b{font-size:22px}.v p{margin:2px 0 0;color:var(--tx)}
ul{margin:0;padding-left:20px}li{margin:4px 0}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sk2);color:var(--nv);margin-right:6px;font-weight:700}.chip.w{background:var(--ab);color:var(--a)}
.hi{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--bd);padding:12px 0}.hi:first-of-type{border-top:0}
.hi .t{flex:1;min-width:200px}
.err{background:var(--rb);color:var(--r);padding:12px 14px;border-radius:12px;margin-top:12px}
.sp{width:42px;height:42px;border:5px solid var(--sk2);border-top-color:var(--sk);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.opt{display:block;width:100%;text-align:left;margin-top:8px}
.quote{text-align:center;color:var(--nv);font-weight:700;margin:26px 0 4px}
a.src{color:var(--nv);font-weight:700}
</style></head><body>
<div id="frame"><header><div class="hr"><a class="logo" href="#home">FACT CHECK <b>AI</b></a><button class="tg" id="dv" data-act="dev" aria-label="기기 화면 비율 변경"></button><button class="tg" id="tg" data-act="theme" aria-label="화면 모드 변경"></button></div>
<nav><a href="#home">홈</a><a href="#analyze">뉴스 분석</a><a href="#history">분석 기록</a><a href="#learn">교육</a><a href="#quiz">퀴즈</a><a href="#about">서비스 소개</a></nav></header>
<main id="app"></main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const st={cur:null,loading:false,err:'',text:''};
let mode=LS.get('fc_mode','system');
const MD={light:'☀️ 라이트',dark:'🌙 다크',system:'🖥 시스템'};
function applyMode(){const r=document.documentElement;mode==='system'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',mode);$('#tg').textContent=MD[mode]}
const V={reliable:['신뢰할 만한 정보','✓','g'],check:['추가 확인 필요','!','a'],false:['허위 정보 가능성 있음','✕','r'],insufficient:['판단할 근거 부족','?','n']};
const AG={stat:['통계청','https://kostat.go.kr'],kdca:['질병관리청','https://www.kdca.go.kr'],moe:['교육부','https://www.moe.go.kr'],korea:['정책브리핑(정부 공식 발표)','https://www.korea.kr'],snu:['SNU 팩트체크센터','https://factcheck.snu.ac.kr'],kpf:['한국언론진흥재단','https://www.kpf.or.kr']};
const EX='정부가 다음 달부터 전국 모든 학교의 급식을 전면 중단하기로 결정했다고 한다. 충격적인 이 소식은 믿을 만한 관계자에게서 나온 것이며, 학부모 100%가 이미 알고 있다. 지금 당장 공유하지 않으면 큰일 난다!';
const LEARN=[['📰 뉴스 출처 확인하기',['기사를 쓴 언론사와 기자 이름이 있는지 확인해요.','처음 보도한 곳이 어디인지, 공식 발표 원문이 있는지 찾아봐요.','“관계자에 따르면” 같은 익명 출처만 있다면 조심해요.']],['⚡ 자극적인 제목에 속지 않기',['“충격”, “긴급”, “100%” 같은 표현은 감정을 자극해요.','제목과 본문 내용이 일치하는지 끝까지 읽어봐요.','화가 나거나 놀랐을 때일수록 공유 전에 한 번 더 멈춰요.']],['🖼 사진·영상 진위 확인',['이미지 역검색으로 처음 올라온 시기를 확인해요.','촬영 날짜와 장소가 주장과 맞는지 살펴요.','손가락, 글자, 배경이 어색하면 AI 생성물일 수 있어요.']],['🤖 AI 생성 정보의 특징',['그럴듯하지만 근거나 출처가 없는 문장이 많아요.','존재하지 않는 기관·논문·통계를 말하기도 해요.','AI의 답도 반드시 공식 자료로 다시 확인해요.']],['✅ 공유하기 전 체크리스트',['누가, 언제, 어디서 한 말인지 확인했나요?','공식 기관이나 다른 언론도 같은 내용을 전하나요?','틀렸다면 누군가 피해를 볼 수 있나요? 확실하지 않으면 공유하지 않아요.']]];
const QZ=[['[가상 사례] SNS에 “내일 A시 시장이 긴급 담화를 발표한대”라는 글이 올라왔다. 출처는 “지인에게 들은 얘기”뿐이다.',false,'확인할 수 있는 출처가 없어요. 시청 공식 채널이나 보도자료를 먼저 확인해야 해요.'],['[가상 사례] 기사가 통계 기관의 이름과 조사 기간을 밝히고, 원문 보고서 링크를 함께 달았다.',true,'확인 가능한 출처가 있어요. 그래도 링크를 열어 수치가 맞는지 직접 확인하면 더 좋아요.'],['[가상 사례] “이것만 먹으면 암이 완치된다!” 개인 후기 한 건이 수만 번 공유됐다.',false,'한 사람의 후기는 의학적 근거가 아니에요. 보건 당국이나 의료 전문가의 설명을 확인해야 해요.'],['[가상 사례] “어제 일어난 사고 현장”이라는 사진을 역검색했더니 3년 전 다른 나라 기사에 먼저 실려 있었다.',false,'오래된 사진을 새 사건처럼 쓴 경우예요. 사진의 최초 출처와 날짜 확인이 중요해요.'],['[가상 사례] 한 언론사가 오보를 인정하고 정정 보도문에 바로잡은 내용과 이유를 밝혔다.',true,'정정 사실을 투명하게 밝힌 보도는 신뢰할 근거가 돼요. 다만 정정 전 기사가 퍼진 것은 별도로 알려야 해요.']];
let qz={q:QZ.map((_,i)=>i),i:0,score:0,wrong:[],ans:null,done:false};
function hist(){return LS.get('fc_hist',[])}
function lst(t,a){return a&&a.length?`<div class="card"><h3>${t}</h3><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
function form(){return `<textarea id="inp" placeholder="뉴스 기사나 SNS 게시글 내용을 붙여넣어 주세요." maxlength="8000">${esc(st.text)}</textarea><div class="row"><button class="btn" data-act="run">뉴스 분석하기</button><button class="btn s" data-act="ex">예시 뉴스 체험하기</button><button class="btn o" data-act="clr">입력창 비우기</button></div>${st.err?`<div class="err">⚠️ ${esc(st.err)}</div>`:''}`}
function hlist(n){const h=hist().slice(0,n||99);return h.length?h.map(x=>{const v=V[x.r.verdict]||V.insufficient;return `<div class="hi"><div class="t"><span class="chip">${v[1]} ${v[0]}</span><div>${esc(x.text.slice(0,70))}${x.text.length>70?'…':''}</div><small class="mu">${esc(x.date)}</small></div><div class="row" style="margin:0"><button class="btn sm s" data-act="view" data-id="${x.id}">결과 보기</button><button class="btn sm o" data-act="re" data-id="${x.id}">다시 분석</button><button class="btn sm o" data-act="del" data-id="${x.id}">삭제</button></div></div>`}).join(''):'<p class="mu">아직 분석 기록이 없어요.</p>'}
const P={
home(){return `<div class="hero"><h1>이 뉴스, 정말 사실일까요?</h1><p class="mu">AI가 뉴스와 게시글을 분석하고 신뢰성을 확인해 드립니다.</p></div><div class="card">${form()}</div>
<div class="grid"><div class="card"><h2>최근 분석 기록</h2>${hlist(3)}</div><div class="card"><h2>가짜 뉴스 예방 정보</h2><ul><li>출처와 날짜를 먼저 확인해요.</li><li>자극적인 제목일수록 한 번 더 의심해요.</li><li>공유하기 전 공식 자료로 확인해요.</li></ul><div class="row"><a class="btn s sm" href="#learn" style="text-decoration:none;display:inline-grid;align-items:center">교육 보기</a><a class="btn s sm" href="#quiz" style="text-decoration:none;display:inline-grid;align-items:center">퀴즈 풀기</a></div></div></div>
<div class="card"><h2>서비스 이용 안내</h2><ul><li>뉴스 내용을 붙여넣고 “뉴스 분석하기”를 눌러요.</li><li>AI의 결과는 참고용이에요. 아래 공식 기관에서 직접 확인해요.</li><li>분석 기록은 이 기기의 브라우저에만 저장돼요.</li></ul></div><p class="quote">올바른 정보가 건강한 공동체를 만듭니다.</p>`},
analyze(){if(st.loading)return `<div class="card" style="text-align:center;padding:48px 18px"><div class="sp"></div><h2>AI가 분석하고 있어요</h2><p class="mu">주장, 수치, 표현을 하나씩 살펴보는 중이에요. 잠시만 기다려 주세요.</p></div>`;return `<h1 style="font-size:28px">뉴스 분석</h1><p class="mu">확인하고 싶은 기사나 게시글 전체를 붙여넣을수록 더 정확해요.</p><div class="card">${form()}</div>`},
result(){const c=st.cur;if(!c)return `<div class="card"><p>표시할 분석 결과가 없어요.</p><a class="btn" href="#analyze" style="text-decoration:none;display:inline-block">뉴스 분석하러 가기</a></div>`;const r=c.r,v=V[r.verdict]||V.insufficient;const ag=(r.agencies||[]).filter(k=>AG[k]),src=(c.sources||[]).filter(s=>/^https?:\/\//.test(s.uri));
return `<div class="v ${v[2]}"><i>${v[1]}</i><div><b>${v[0]}</b><p>${esc(r.summary)}</p></div></div>
<div class="card"><h3>분석한 내용</h3><p class="mu" style="margin:0;white-space:pre-wrap">${esc(c.text.slice(0,400))}${c.text.length>400?'…':''}</p></div>
<div class="card"><h3>핵심 주장과 사실 확인 구분</h3>${(r.claims||[]).map(x=>`<p style="margin:6px 0"><span class="chip ${x.needs_check?'w':''}">${x.type==='opinion'?'의견':'사실 주장'}</span>${x.needs_check?'<span class="chip w">확인 필요</span>':''}${esc(x.text)}</p>`).join('')||'<p class="mu">추출된 주장이 없어요.</p>'}</div>
${lst('과장되거나 자극적인 표현',r.exaggerations)}${lst('날짜·수치·인물·기관 점검',(r.entities||[]).map(e=>`${e.kind}: ${e.text} — ${e.note}`))}
<div class="grid">${lst('확인된 사실',r.confirmed)}${lst('의심되는 부분',r.suspicious)}</div>${lst('추가로 확인해야 할 내용',r.to_check)}${lst('출처 간 충돌하는 정보',r.conflicts)}
<div class="card"><h3>판단 이유</h3><p style="margin:0">${esc(r.reason)}</p></div>
<div class="card"><h3>AI가 검색으로 찾은 자료</h3>${src.length?`<ul>${src.map(s=>`<li><a class="src" href="${esc(s.uri)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.uri)}</a></li>`).join('')}</ul>`:'<p class="mu" style="margin:0">검색으로 찾은 자료가 없어요. 이 경우 “신뢰할 만한 정보”로 판단하지 않아요.</p>'}</div>
<div class="card"><h3>관련 공식 기관 (직접 확인용)</h3><p class="mu" style="margin-top:0">관련될 수 있는 기관의 공식 사이트예요. 이 기관이 내용을 확인해 주었다는 뜻은 아니니 직접 방문해 확인해 주세요.</p>${ag.length?`<ul>${ag.map(k=>`<li><a class="src" href="${AG[k][1]}" target="_blank" rel="noopener noreferrer">${AG[k][0]}</a></li>`).join('')}</ul>`:'<p class="mu">연결할 만한 공식 기관을 찾지 못했어요.</p>'}</div>
<p class="mu" style="font-size:14px">※ AI 분석은 틀릴 수 있어요. 최종 판단은 공식 자료를 확인한 뒤 직접 내려 주세요.</p>
<div class="row"><button class="btn" data-act="copy">결과 복사</button><button class="btn s" data-act="again">다시 분석하기</button><a class="btn o" href="#analyze" style="text-decoration:none;display:inline-grid;align-items:center">새 뉴스 분석</a></div>`},
history(){const n=hist().length;return `<h1 style="font-size:28px">분석 기록</h1><div class="card">${hlist()}${n?'<div class="row"><button class="btn o sm" data-act="delall">전체 삭제</button></div>':''}</div>`},
learn(){return `<h1 style="font-size:28px">가짜 뉴스 예방 교육</h1><div class="grid">${LEARN.map(x=>`<div class="card"><h2>${x[0]}</h2><ul>${x[1].map(t=>`<li>${t}</li>`).join('')}</ul></div>`).join('')}</div>`},
quiz(){if(qz.done){return `<div class="card" style="text-align:center"><h2>퀴즈 완료!</h2><p style="font-size:34px;margin:6px 0">${qz.score} / ${qz.q.length}</p><p class="mu">최고 점수: ${LS.get('fc_best',0)}점</p><div class="row c"><button class="btn" data-act="qretry">처음부터 다시</button>${qz.wrong.length?'<button class="btn s" data-act="qwrong">틀린 문제 다시 학습</button>':''}</div></div>`}
const k=qz.q[qz.i],q=QZ[k],a=qz.ans;return `<h1 style="font-size:28px">팩트체크 퀴즈</h1><p class="mu">${qz.i+1} / ${qz.q.length} · 점수 ${qz.score}</p><div class="card"><p style="font-weight:700">${esc(q[0])}</p><p class="mu" style="margin:0">이 정보는 신뢰할 수 있을까요?</p>${a==null?`<button class="btn s opt" data-act="qa" data-v="1">신뢰할 만해요</button><button class="btn s opt" data-act="qa" data-v="0">신뢰하기 어려워요</button>`:`<div class="v ${a===q[1]?'g':'r'}" style="margin-top:12px"><i>${a===q[1]?'✓':'✕'}</i><div><b>${a===q[1]?'정답!':'오답'}</b><p>정답: ${q[1]?'신뢰할 만해요':'신뢰하기 어려워요'}. ${esc(q[2])}</p></div></div><button class="btn" data-act="qn">${qz.i+1<qz.q.length?'다음 문제':'결과 보기'}</button>`}</div>`},
about(){return `<h1 style="font-size:28px">서비스 소개</h1><div class="card"><h2>FACT CHECK AI란?</h2><p>가짜 뉴스와 허위 정보가 빠르게 퍼지는 시대에, 뉴스와 게시글의 주장·수치·표현을 AI가 점검하고 확인할 방법을 알려 주는 서비스예요.</p></div><div class="card"><h2>이렇게 판단해요</h2><ul><li>입력한 내용을 무조건 사실로 받아들이지 않아요.</li><li>주장과 의견을 나누고, 확인이 필요한 문장을 따로 뽑아요.</li><li>표현이 자극적이라는 이유만으로 가짜라고 단정하지 않아요.</li><li>근거가 부족하면 “판단할 근거 부족”으로 표시해요.</li></ul></div><div class="card"><h2>한계를 솔직하게</h2><ul><li>Gemini AI가 Google 검색으로 자료를 찾지만, 검색 결과가 부족하거나 아주 최근 소식은 확인하지 못할 수 있어요.</li><li>출처는 실제 검색에서 나온 링크만 보여 주고, 임의로 만들지 않아요.</li><li>AI도 틀릴 수 있으니 결과는 참고용으로 사용해 주세요.</li></ul></div><p class="quote">올바른 정보가 건강한 공동체를 만듭니다.</p><p class="mu" style="text-align:center">정확한 정보를 확인하고, 주변 사람과 함께 나눠 주세요.</p>`}};
function render(){const p=(location.hash||'#home').slice(1),f=P[p]||P.home;$('#app').innerHTML=f();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+(p==='result'?'analyze':p)))}
addEventListener('hashchange',()=>{render();scrollTo(0,0);$('#frame').scrollTo(0,0)});
function save(c){const h=hist();h.unshift({id:String(Date.now()),text:c.text,r:c.r,sources:c.sources||[],date:c.date});LS.set('fc_hist',h.slice(0,30))}
async function analyze(text){text=text.trim();st.text=text;if(text.length<15){st.err='분석할 내용을 15자 이상 입력해 주세요.';return render()}
st.err='';st.loading=true;location.hash==='#analyze'?render():(location.hash='analyze');
try{const rs=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});let d={};try{d=await rs.json()}catch(x){}
if(!rs.ok){const er=new Error(d.error||'서버 오류('+rs.status+')');if(rs.status===429)er.code='rate_limited';throw er}
const r=d.r||{};if(!V[r.verdict])r.verdict='insufficient';
st.cur={text,r,sources:d.sources||[],date:new Date().toLocaleString('ko-KR')};save(st.cur);st.loading=false;location.hash==='#result'?render():(location.hash='result')}
catch(e){st.loading=false;st.err=(e&&e.code==='not_granted')?'AI 사용 권한이 허용되지 않았어요. 허용 후 다시 시도해 주세요.':(e&&e.code==='rate_limited')?'요청이 많아요. 잠시 후 다시 시도해 주세요.':'분석 중 오류가 발생했어요: '+((e&&e.message)||'알 수 없는 오류');location.hash==='#analyze'?render():(location.hash='analyze')}}
function toast(m){alert(m)}
document.addEventListener('input',e=>{if(e.target.id==='inp')st.text=e.target.value});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
if(a==='theme'){mode=mode==='system'?'light':mode==='light'?'dark':'system';LS.set('fc_mode',mode);applyMode()}
else if(a==='dev'){dev=dev==='auto'?'phone':dev==='phone'?'tablet':'auto';LS.set('fc_dev',dev);fit()}
else if(a==='run')analyze(st.text);
else if(a==='ex'){st.text=EX;st.err='';render()}
else if(a==='clr'){st.text='';st.err='';render()}
else if(a==='re'){const x=hist().find(h=>h.id===id);if(x)analyze(x.text)}
else if(a==='again'){if(st.cur)analyze(st.cur.text)}
else if(a==='view'){const x=hist().find(h=>h.id===id);if(x){st.cur=x;location.hash='result'}}
else if(a==='del'){LS.set('fc_hist',hist().filter(h=>h.id!==id));render()}
else if(a==='delall'){if(confirm('분석 기록을 모두 삭제할까요?')){LS.set('fc_hist',[]);render()}}
else if(a==='copy'){const c=st.cur,r=c.r,v=V[r.verdict];const t=`[FACT CHECK AI] ${v[0]}\n${r.summary}\n\n판단 이유: ${r.reason}\n의심되는 부분: ${(r.suspicious||[]).join(' / ')}\n추가 확인: ${(r.to_check||[]).join(' / ')}\n\n※ AI 분석은 참고용입니다.`;
 try{await navigator.clipboard.writeText(t);toast('복사했어요!')}catch(x){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사했어요!')}catch(y){toast('복사에 실패했어요.')}ta.remove()}}
else if(a==='qa'){const k=qz.q[qz.i];qz.ans=b.dataset.v==='1';if(qz.ans===QZ[k][1])qz.score++;else if(!qz.wrong.includes(k))qz.wrong.push(k);render()}
else if(a==='qn'){qz.ans=null;qz.i++;if(qz.i>=qz.q.length){qz.done=true;if(qz.q.length===QZ.length&&qz.score>LS.get('fc_best',0))LS.set('fc_best',qz.score)}render()}
else if(a==='qretry'){qz={q:QZ.map((_,i)=>i),i:0,score:0,wrong:[],ans:null,done:false};render()}
else if(a==='qwrong'){qz={q:qz.wrong.slice(),i:0,score:0,wrong:[],ans:null,done:false};render()}});
let dev=LS.get('fc_dev','auto');if(!['auto','phone','tablet'].includes(dev))dev='auto';
const DV={auto:['📐 자동',0],phone:['📱 휴대폰 9:16',9/16],tablet:['🔲 탭 16:10',16/10]};
function fit(){const r=document.documentElement,f=$('#frame');if(dev==='auto'){r.removeAttribute('data-dev');f.style.width='';f.style.height=''}else{r.setAttribute('data-dev',dev);const b=document.body,k=DV[dev][1],w=Math.min(b.clientWidth,b.clientHeight*k);f.style.width=w+'px';f.style.height=(w/k)+'px'}$('#dv').textContent=DV[dev][0]}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
applyMode();fit();render();
</script></body></html>
